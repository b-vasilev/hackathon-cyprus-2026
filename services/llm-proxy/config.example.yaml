# The container loads this file with its key and OAuth folder supplied by .env.
host: "0.0.0.0"
port: 8317
auth-dir: "/data/auth"
api-keys: [] # LLM_SUBSCRIPTION_KEY is provided by the container environment.

remote-management:
  allow-remote: false
  secret-key: ""
  disable-control-panel: true

# The wrapper imports every Codex CLI auth JSON in auth-dir by account_id.
# CLIProxyAPI selects among the available accounts using its native routing.
