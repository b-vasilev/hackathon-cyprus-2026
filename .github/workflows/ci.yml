name: Tests and checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v5
        with:
          cache: true
          install_args: go golangci-lint just go:golang.org/x/vuln/cmd/govulncheck
      - name: Check formatting
        run: just backend::fmt-check
      - name: Lint
        if: ${{ !cancelled() }}
        run: just backend::lint
      - name: Audit dependencies
        if: ${{ !cancelled() }}
        run: just backend::audit
      - name: Check dependency files are tidy
        working-directory: backend
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

  backend-tests:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v5
        with:
          cache: true
          install_args: go node just
      - name: Install source packager
        run: just frontend::deps
      - name: Run all backend tests with race detection
        run: just backend::test-race

  frontend:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v5
        with:
          cache: true
          install_args: node just
      - name: Install dependencies
        run: just frontend::deps
      - name: Check formatting
        run: just frontend::format-check
      - name: Lint
        if: ${{ !cancelled() }}
        run: just frontend::lint
      - name: Check types
        if: ${{ !cancelled() }}
        run: just frontend::typecheck
      - name: Build frontend
        run: just frontend::build

  frontend-tests:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v5
        with:
          cache: true
          install_args: node just
      - name: Install dependencies
        run: just frontend::deps
      - name: Run all frontend tests
        run: just frontend::test
