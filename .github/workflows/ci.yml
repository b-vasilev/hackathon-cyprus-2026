name: Tests and checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v5
        with:
          cache: true
          install_args: go node golangci-lint just go:golang.org/x/vuln/cmd/govulncheck
      - name: Install source packager
        run: just frontend::deps
      - name: Check formatting
        run: just backend::fmt-check
      - name: Lint
        if: ${{ !cancelled() }}
        run: just backend::lint
      - name: Run all backend tests with race detection
        if: ${{ !cancelled() }}
        run: just backend::test-race
      - name: Audit dependencies
        if: ${{ !cancelled() }}
        run: just backend::audit
      - name: Check dependency files are tidy
        working-directory: backend
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v5
        with:
          cache: true
          install_args: node just
      - name: Install dependencies
        run: just frontend::deps
      - name: Check formatting
        run: just frontend::format-check
      - name: Lint
        if: ${{ !cancelled() }}
        run: just frontend::lint
      - name: Check types
        if: ${{ !cancelled() }}
        run: just frontend::typecheck
      - name: Run all frontend tests
        if: ${{ !cancelled() }}
        run: just frontend::test
      - name: Build frontend
        run: just frontend::build

  proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v5
        with:
          cache: true
          install_args: go just go:golang.org/x/vuln/cmd/govulncheck
      - name: Check formatting
        run: just proxy::fmt-check
      - name: Lint
        if: ${{ !cancelled() }}
        run: just proxy::lint
      - name: Run all proxy tests with race detection
        if: ${{ !cancelled() }}
        run: just proxy::test -race -count=1
      - name: Audit dependencies
        if: ${{ !cancelled() }}
        run: just proxy::audit
