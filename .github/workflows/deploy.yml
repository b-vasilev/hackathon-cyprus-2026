name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Deploys run one at a time; a newer push waits for the current deploy.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://${{ vars.DEPLOY_HOST }}
    env:
      IMAGE: wayfinder:${{ github.sha }}
      TARGET: ${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          tags: ${{ env.IMAGE }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519

      - name: Upload image and stack
        run: |
          docker save "$IMAGE" | gzip | ssh "$TARGET" 'gunzip | docker load'
          scp deploy/compose.yaml "$TARGET:/opt/wayfinder/compose.yaml"

      - name: Restart stack
        run: |
          # Builds from the last week stay on the VM for rollback by retagging.
          ssh "$TARGET" "docker tag '$IMAGE' wayfinder:current && cd /opt/wayfinder && docker compose up -d --wait --remove-orphans && docker image prune -af --filter 'until=168h'"

      - name: Check public endpoint
        run: curl --fail --silent --show-error --retry 10 --retry-delay 3 --retry-all-errors "https://${{ vars.DEPLOY_HOST }}/readyz"
