services:
  api:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      HTTP_ADDR: 0.0.0.0:8080
      DATABASE_PATH: /app/data/onboarding.db
      LOG_FORMAT: json
      LOG_LEVEL: info
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    volumes:
      - onboarding-data:/app/data
    init: true
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/readyz"]
      interval: 15s
      timeout: 3s
      retries: 3
    restart: unless-stopped

volumes:
  onboarding-data:
